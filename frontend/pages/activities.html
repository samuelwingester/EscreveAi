<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/activities.css">

    <script type="module" src="../js/components/base/load.js"></script>
    <script type="module" src="../js/components/activities/load.js"></script>
    <script type="module" src="../js/components/common/load.js"></script>

    <script type="module" src="../js/request/base.js" defer></script>
</head>

<body>
    <base-body active="activities">
        <header>
            <h1>Bom Dia, Professor <span id="nome-professor"></span>👋</h1>
            <div class="bottom">
                <div class="class">
                    <h3>Atividades - Turma:</h3>
                    <h2 class="turma-titulo">Sem Turmas</h2>
                </div>
                <button class="botao-largo" onclick="document.getElementById('activity-modal').showModal()">
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-plus"></use>
                    </svg>
                    <p>Nova Atividade</p>
                </button>
            </div>
        </header>

        <div class="activities">
            <activity-card title="Nomaaa da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="20 de Junho de 2026" img-src="../imgs/activities/IMG.png">
            </activity-card>
            <activity-card title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="67 de Maio de 2022" img-src="../imgs/activities/IMG.png">
            </activity-card>
            <activity-card title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="20 de Junho de 2026" img-src="../imgs/activities/IMG.png">
            </activity-card>
            <activity-card title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="12 de Junho de 2026" img-src="../imgs/activities/IMG.png">
            </activity-card>
            <activity-card title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="2 de Julho de 2025" img-src="../imgs/activities/IMG.png">
            </activity-card>
        </div>

        <dialog id="activity-modal" class="modal">
            <div class="add">
                <header>
                    <h3>Nova Atividade</h3>
                    <svg onclick="document.getElementById('activity-modal').close()">
                        <use href="../assets/icons/sprite.svg#icon-x"></use>
                    </svg>
                </header>
                <div class="forms">
                    <div class="info">
                        <div class="line"></div>
                        <h2>INFORMAÇÕES DA ATIVIDADE</h2>
                        <div class="line"></div>
                    </div>
                    <form action="#">
                        <common-field label="Nome da Atividade" input_id="form-activity-name"
                            placeholder="Escreva o nome da atividade..." size="field">
                        </common-field>

                        <common-field label="Descrição" input_id="form-activity-description"
                            placeholder="Descreva brevemente a atividade..." size="field">
                        </common-field>

                        <div class="upload">
                            <div class="container">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-file-upload"></use>
                                </svg>
                                <p>Arraste um arquivo ou clique aqui para enviar</p>
                                <p>PDF, JPG ou PNG • Máx. 10 MB</p>
                                <button class="botao-largo">
                                    <svg>
                                        <use href="../assets/icons/sprite.svg#icon-save"></use>
                                    </svg>
                                    <input type="file" name="" id="">
                                </button>
                            </div>
                        </div>

                        <div class="botoes">
                            <button type="button"
                                onclick="document.getElementById('activity-modal').close()">Cancelar</button>
                            <button class="botao-largo" type="submit">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-save"></use>
                                </svg>
                                <p>Salvar Atividade</p>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </dialog>
    </base-body>
</body>

</html>
