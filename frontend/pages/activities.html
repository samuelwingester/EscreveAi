<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/activities.css">
    <script type="module" src="../js/components/main.js"></script>
</head>

<body>
    <my-base active="activities">
        <header>
            <h1>Bom Dia, Professor <span id="nome-professor">João</span>👋</h1>
            <div class="summary">
                <h3>Resumo da Turma:</h3>
                <h2 class="turma-titulo">3º A</h2>
            </div>
        </header>
        <div class="atividade">
            <div class="info">
                <div class="image">
                </div>
                <div class="desc">
                    <p class="title">Nome da Atividade</p>
                    <p>— 20 de Junho de 2026</p>
                    <div class="quantImgs">
                        <svg>
                            <use href="../assets/icons/sprite.svg#icon-image"></use>
                        </svg>
                        <p>
                            8 imagens
                        </p>
                    </div>
                </div>
            </div>


            <div class="ferramentas">
                <div class="date">
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-calendar"></use>
                    </svg>
                    <p>20 de Junho de 2026</p>
                </div>
                <div class="botoes">
                    <button class="botao-largo">
                        <svg>
                            <use href="../assets/icons/sprite.svg#icon-eye"></use>
                        </svg>
                        <p>Ver Detalhes</p>
                    </button>
                    <button class="botao-largo">
                        <svg>
                            <use href="../assets/icons/sprite.svg#icon-pencil"></use>
                        </svg>
                        <p>Editar</p>
                    </button>
                </div>
            </div>
        </div>
    </my-base>
</body>

</html>
