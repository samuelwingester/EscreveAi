<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/activities.css">
    <script type="module" src="../js/components/main.js"></script>
    <script>

    </script>
</head>

<body>
    <my-base active="activities">
        <header>
            <h1>Bom Dia, Professor <span id="nome-professor">João</span>👋</h1>
            <div class="bottom">
                <div class="class">
                    <h3>Atividades - Turma:</h3>
                    <h2 class="turma-titulo">3º A</h2>
                </div>
                <button class="botao-largo" onclick="document.getElementById('activity-modal').showModal()">
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-plus"></use>
                    </svg>
                    <p>Nova Atividade</p>
                </button>
            </div>
        </header>

        <div class="activities">
            <my-activity title="Nomaaa da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="20 de Junho de 2026" img-src="../imgs/activities/IMG.png">
            </my-activity>
            <my-activity title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="67 de Maio de 2022" img-src="../imgs/activities/IMG.png">
            </my-activity>
            <my-activity title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="20 de Junho de 2026" img-src="../imgs/activities/IMG.png">
            </my-activity>
            <my-activity title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="12 de Junho de 2026" img-src="../imgs/activities/IMG.png">
            </my-activity>
            <my-activity title="Nome da Atividade"
                description="Os alunos escreveram os nomes das frutas observando as imagens." img-count="7"
                date="2 de Julho de 2025" img-src="../imgs/activities/IMG.png">
            </my-activity>
        </div>

        <dialog id="activity-modal" class="modal">
            <div class="add">
                <header>
                    <h3>Nova Atividade</h3>
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-x"></use>
                    </svg>
                </header>
                <div class="forms">
                    <div class="info">
                        <div class="line"></div>
                        <h2>INFORMAÇÕES DA ATIVIDADE</h2>
                        <div class="line"></div>
                    </div>
                    <form action="#">
                        <div class="field">
                            <p>Nome da Atividade</p>
                            <input type="text" id="form-activity-name">
                        </div>
                        <div class="field">
                            <p>Descrição</p>
                            <input type="text" id="form-activity-description">
                        </div>
                        <div class="upload">
                            <div class="container">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-file-upload"></use>
                                </svg>
                                <p>Arraste um arquivo ou clique aqui para enviar</p>
                                <p>PDF, JPG ou PNG • Máx. 10 MB</p>
                                <button class="botao-largo">
                                    <svg>
                                        <use href="../assets/icons/sprite.svg#icon-save"></use>
                                    </svg>
                                    <p>Selecionar Arquivo</p>
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="botoes">
                        <button>Cancelar</button>
                        <button class="botao-largo">
                            <svg>
                                <use href="../assets/icons/sprite.svg#icon-calendar"></use>
                            </svg>
                            <p>Salvar Atividade</p>
                        </button>
                    </div>
                </div>
            </div>
            </div>

        </dialog>
    </my-base>
</body>

</html>
