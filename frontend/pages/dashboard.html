<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/dashboard.css">
    <script type="module" src="../js/components/main.js"></script>
</head>

<body>
    <my-base active="dashboard">
        <header>
            <h1>Bom Dia, Professor <span id="nome-professor">João</span>👋</h1>
            <div class="summary">
                <h3>Resumo da Turma:</h3>
                <h2 class="turma-titulo">3º A</h2>
            </div>
        </header>
        <div class="data">
            <div class="numbers">
                <my-number title="24" description="Alunos" color="blue"></my-number>
                <my-number title="18" description="Atividades" color="purple"></my-number>
                <my-number title="8" description="Relatórios" color="yellow"></my-number>
                <my-number title="92%" description="Evoluções médias" color="green"></my-number>
            </div>
            <div class="graphs">
                <div class="graph" id="graphBarras">
                    <header>
                        <div class="circle">
                            <svg>
                                <use href="../assets/icons/sprite.svg#icon-graphbar"></use>
                            </svg>
                        </div>
                        <div class="text">
                            <p class="title">Evolução da Turma</p>
                            <p class="subtitle">Distribuição de alunos por Fase</p>
                        </div>
                    </header>
                    <div class="container">
                        <div class="values">
                            <my-value percentage="12" total="4" color="purple" id="pre-silabico">
                                Pré Silábico
                            </my-value>
                            <my-value percentage="21" total="7" color="blue" id="silabico">
                                Silábico
                            </my-value>
                            <my-value percentage="30" total="10" color="green" id="silabico-alfabetico">
                                Silábico-Alfabético
                            </my-value>
                            <my-value percentage="24" total="8" color="yellow" id="alfabetico">
                                Alfabético
                            </my-value>

                        </div>
                        <div class="total">
                            <svg class="purple">
                                <use href="../assets/icons/sprite.svg#icon-users"></use>
                            </svg>
                            <p class="title">Total de Alunos: <span id="total-alunos" class="purple">29</span></p>
                        </div>
                    </div>
                </div>
                <div class="graph" id="graphConquistas">
                    <header>
                        <div class="circle">
                            <svg>
                                <use href="../assets/icons/sprite.svg#icon-bell"></use>
                            </svg>
                        </div>
                        <div class="text">
                            <p class="title">Conquistas Recentes </p>
                            <p class="subtitle">Acompanhhe os avanços da sua Turma</p>
                        </div>
                    </header>
                    <div class="container">

                    </div>
                </div>
            </div>
        </div>
    </my-base>


</body>


</html>
