<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/config.css">

    <script type="module" src="../js/components/base/load.js"></script>
    <script type="module" src="../js/components/common/load.js"></script>
    <script type="module" src="../js/components/config/load.js"></script>

    <script type="module" src="../js/request/config.js" defer></script>
</head>

<body>
    <base-body active="config">
        <div class="screen">
            <header>
                <h1>Configurações</h1>
                <h2>Personalize sua experiência</h2>
            </header>
            <div class="items">
                <div class="item" id="account">
                    <div class="content">
                        <header>
                            <div class="icon">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-user" stroke-width="8px"></use>
                                </svg>
                            </div>
                            <div class="text">
                                <p class="subtitle">Minha Conta</p>
                                <p>Gerencie suas informações pessoais e de acesso</p>
                            </div>
                        </header>
                        <div class="options">
                            <div class="perfil">
                                <div class="left">
                                    <div class="icon">
                                        <svg>
                                            <use href="../assets/icons/sprite.svg#icon-pencil"></use>
                                        </svg>
                                    </div>
                                    <div class="info">
                                        <p><b>João Pedro Bosco</b></p>
                                        <p class="disabled">joaopedroprof@gmail.com</p>
                                    </div>
                                </div>
                                <div class="botao-largo" id="vazioBorda2">
                                    <p>Editar Perfil</p>
                                </div>
                            </div>
                            <config-option title="Sair da conta" icon="logout" stroke="2" modal="edit-user"></config-option>
                        </div>
                        <div class="botao-largo delete" id="vazioBorda2">
                            <svg>
                                <use href="../assets/icons/sprite.svg#icon-delete"></use>
                            </svg>
                            <p> Deletar Conta</p>
                        </div>
                    </div>
                </div>
                <div class="item" id="privacity">
                    <div class="content">
                        <header>
                            <div class="icon">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-lock" stroke-width="2px"></use>
                                </svg>
                            </div>
                            <div class="text">
                                <p class="subtitle">Privacidade</p>
                                <p>Mantenha sua conta segura e protegida</p>
                            </div>
                        </header>
                        <div class="options">
                            <config-option title="Alterar Senha" icon="key" stroke="2"></config-option>
                            <config-option title="Autenticação em duas etapas" subtitle="Ultima alteração há 3 meses"
                                icon="shield" stroke="2"></config-option>
                        </div>
                    </div>
                </div>
                <div class="item" id="about">
                    <div class="content">
                        <header>
                            <div class="icon">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-lock" stroke-width="2px"></use>
                                </svg>
                            </div>
                            <div class="text">
                                <p class="subtitle">Sobre</p>
                                <p>Informações sobre o Escreve aí</p>
                            </div>
                        </header>
                        <div class="options">
                            <config-option title="Política de Privacidade" icon="shield" stroke="2"></config-option>
                            <config-option title="Termos de Uso" icon="document" stroke="2"></config-option>
                            <config-option title="Versão do Sistema" subtitle="v1.2.3 - Atualizado em 10/06/2024" icon="wand" stroke="2"></config-option>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <dialog id="edit-user-modal" class="modal"></dialog>
    </base-body>e4h
</body>

</html>
