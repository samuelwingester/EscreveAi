<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/students.css">

    <script type="module" src="../js/components/base/load.js"></script>
    <script type="module" src="../js/components/common/load.js"></script>
    <script type="module" src="../js/components/students/load.js"></script>

    <script type="module" src="../js/request/student.js" defer></script>
</head>

<body>
    <base-body active="config">
        <div class="container">
            <header>
                <h1>Configurações</h1>
                <h2>Personalize sua experiência</h2>
            </header>
            <div class="options">
                <div class="option">
                    <div class="content">
                        <header>
                            <div class="icon">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-user"></use>
                                </svg>
                            </div>
                            <p class="title">Minha Conta</p>
                            <p class="subtitle">Gerencie suas informações pessoais e de acesso</p>
                        </header>
                        <div class="perfil">
                            <div class="icon">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-pencil"></use>
                                </svg>
                            </div>
                            <div class="info">
                                <p class="title">João Pedro Bosco</p>
                                <p class="subtitle">joaopedroprof@gmail.com</p>
                            </div>
                            <div class="botao-largo">
                                <p>Editar Perfil</p>
                            </div>
                        </div>
                        <div class="logout">
                            <div class="icon">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-logout"></use>
                                </svg>
                            </div>
                            <div class="info">
                                <p class="title">Sair da Conta</p>
                            </div>
                            <svg>
                                <use href="../assets/icons/sprite.svg#icon-dropdown-right"></use>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </base-body>
</body>

</html>
