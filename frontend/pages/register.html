<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí - Cadastro</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/register.css">
    <script type="module" src="../js/components/main.js"></script>

    <script type="module" src="../js/request/register.js"></script>
</head>

<body>
    <header-padrao></header-padrao>

    <main>
        <div class="container">
            <img src="../imgs/logos/logoH.png" alt="Logo Escreve Aí">
            
            <header>
                <h1>Criar Conta</h1>
                <p class="subtitle">Cadastre-se para começar a acompanhar a evolução da escrita dos seus alunos.</p>
            </header>

            <form action="" id="register-form">
                <my-field icon="user" placeholder="Nome Completo" stroke="6" type="text" input_id="input_name"></my-field>
                <my-field icon="mail" placeholder="Email" stroke="1.5" type="email" input_id="input_email"></my-field>

                <!-- <my-field icon="calendar" placeholder="Data de Nascimento" stroke="1.5" type="date" input_id="input_birth_date"></my-field> -->
                <input type="date" name="" id="input_birth_date">
                <!-- <my-field icon="gender" placeholder="Gênero" stroke="1.5"></my-field> -->

                <select id="input_gender">
                    <option value="man">Homem</option>
                    <option value="woman">Mulher</option>
                    <option value="">Prefiro Não Dizer</option>
                </select>

                <my-field icon="lock" placeholder="Senha" stroke="1.5" eye="true" style="grid-column: 1/-1;" type="password" input_id="input_password"></my-field>
                <my-field icon="lock" placeholder="Confirmar Senha" stroke="1.5" eye="true" style="grid-column: 1/-1;" type="password" input_id="input_password_confirmation"></my-field>
                
                <div class="confirm">
                    <div class="remember">
                        <label class="custom-checkbox">
                            <input type="checkbox" name="remember" id="checkbox_remember">
                            <span class="checkmark">
                                <svg>
                                    <use href="../../assets/icons/sprite.svg#icon-check"></use>
                                </svg>
                            </span>
                        </label>
                        <p class="body-small">Lembrar de Mim</p>
                    </div>

                    <div class="forgot">
                        <p class="body-small purple"><a href="">Esqueceu sua Senha?</a></p>
                    </div>
                </div>
                <input type="submit" value="">
                <div class="botao-padrao">
                    <p>Entrar</p>
                </div>
                <div class="line-between">
                    <div class="line"></div>
                    <p>OU</p>
                    <div class="line"></div>
                </div>
                <div class="login">
                    <p>
                        Já possui uma conta? 
                        <a href="login.html" class="purple">
                            Entrar
                            <svg>
                                <use href="../../assets/icons/sprite.svg#icon-arrow-right"></use>
                            </svg>
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
