<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí - Cadastro</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/register.css">
    <script type="module" src="../js/components/main.js"></script>

    <script type="module" src="../js/request/register.js"></script>
</head>

<body>
    <header-padrao></header-padrao>

    <main>
        <div class="container">
            <img src="../imgs/logos/logoH.png" alt="Logo Escreve Aí">

            <header>
                <h1>Criar Conta</h1>
                <p class="subtitle">Cadastre-se para começar a acompanhar a evolução da escrita dos seus alunos.</p>
            </header>

            <form action="" id="register-form">
                <div id="register-error" class="error-banner" style="grid-column: 1 / -1;" hidden></div>
                <my-field input_id="input_name" name="name" type="text" icon="user" stroke="6" placeholder="Nome Completo"></my-field>
                <my-field input_id="input_gender" name="gender" is_select="true" icon="gender" stroke="1.5" placeholder="Gênero">
                    <option value="man">Homem</option>
                    <option value="woman">Mulher</option>
                    <option value="other">Prefiro Não Dizer</option>
                </my-field>
                <my-field input_id="input_email" name="email" type="email" icon="mail" stroke="1.5" placeholder="Email" style="grid-column: 1/-1;"></my-field>
                <my-field input_id="input_password" name="password" type="password" icon="lock" stroke="1.5" eye="true" placeholder="Senha" style="grid-column: 1/-1;"></my-field>
                <my-field input_id="input_password_confirmation" name="password_confirmation" type="password" icon="lock" stroke="1.5" eye="true" placeholder="Confirmar Senha" style="grid-column: 1/-1;"></my-field>
                
                <div class="confirm">
                    <div class="remember">
                        <label class="custom-checkbox">
                            <input type="checkbox" name="remember" id="checkbox_remember">
                            <span class="checkmark">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-check"></use>
                                </svg>
                            </span>
                        </label>
                        <p class="body-small">Lembrar de Mim</p>
                    </div>

                    <div class="forgot">
                        <p class="body-small purple"><a href="">Esqueceu sua Senha?</a></p>
                    </div>
                </div>
                <button type="submit" class="botao-padrao">
                    <p>Entrar</p>
                </button>
                <div class="line-between">
                    <div class="line"></div>
                    <p>OU</p>
                    <div class="line"></div>
                </div>
                <div class="login">
                    <p>
                        Já possui uma conta?
                        <a href="login.html" class="purple">
                            Entrar
                            <svg>
                                <use href="../assets/icons/sprite.svg#icon-arrow-right"></use>
                            </svg>
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
