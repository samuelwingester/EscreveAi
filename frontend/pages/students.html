<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/students.css">

    <script type="module" src="../js/components/base/load.js"></script>
    <script type="module" src="../js/components/common/load.js"></script>
    <script type="module" src="../js/components/students/load.js"></script>

    <script type="module" src="../js/request/base.js" defer></script>
</head>

<body>
    <base-body active="students">
        <header>
            <h1>Bom Dia, Professor <span id="nome-professor">João</span>👋</h1>
            <div class="bottom">
                <div class="class">
                    <h3>Atividades - Turma:</h3>
                    <h2 class="turma-titulo">3º A</h2>
                </div>
                <button class="botao-largo" onclick="document.getElementById('student-modal').showModal()">
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-plus"></use>
                    </svg>
                    <p>Novo Aluno</p>
                </button>
            </div>
        </header>
        <input class="search" placeholder="Pesquisar por Turma..."></input>
        <div class="cards">
            <student-card name="JÃO" phase="Silábico" last-activity="25 de junho de 2026">
            </student-card>
            <student-card name="dsagasf" phase="sfqrewqf" last-activity="27 de junho de 2026">
            </student-card>
            <student-card name="qawegesdg" phase="egqeafdesf" last-activity="1 de junho de 2026">
            </student-card>
            <student-card name="aaa" phase="wqfeqtgweag" last-activity="67 de junho de 2026">
            </student-card>
        </div>


        <dialog id="student-modal" class="modal">
            <div class="add">
                <header>
                    <h3>Novo Aluno</h3>
                    <svg class="icon-close" onclick="document.getElementById('student-modal').close()">
                        <use href="../assets/icons/sprite.svg#icon-x"></use>
                    </svg>
                </header>

                <div class="forms">
                    <header>
                        <div class="line"></div>
                        <h3>Dados Pessoais</h3>
                        <div class="line"></div>
                    </header>

                    <form action="#">
                        <div class="initial">
                            <div class="photo">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-x"></use>
                                </svg>
                            </div>
                            <common-field label="Nome Completo" placeholder="Digite o nome completo do aluno..."
                                input_id="input-form-student-name" size="field">
                            </common-field>

                            <common-field label="Data de Nascimento" placeholder="dd/mm/aaaa"
                                input_id="input-form-birthdate" icon_id="icon-calendar" type="date" size="field">
                            </common-field>
                        </div>
                        <common-field label="Turma" placeholder="Selecione a Turma" input_id="input-form-class"
                            icon_id="icon-users" is_select="true" size="field">
                            <option value="1a">1º A</option>
                            <option value="2a">2º A</option>
                            <option value="3a">3º A</option>
                            <option value="1b">1º B</option>
                        </common-field>

                        <div class="radio-field">
                            <h3>Sexo</h3>
                            <div class="radio_group">
                                <label class="radio_box">
                                    <input type="radio" name="sexo" value="masculino" checked />
                                    <svg class="input-icon">
                                        <use href="../assets/icons/sprite.svg#icon-male"></use>
                                    </svg>
                                    <span>Masculino</span>
                                </label>

                                <label class="radio_box">
                                    <input type="radio" name="sexo" value="feminino" />
                                    <svg class="input-icon">
                                        <use href="../assets/icons/sprite.svg#icon-female"></use>
                                    </svg>
                                    <span>Feminino</span>
                                </label>

                                <label class="radio_box">
                                    <input type="radio" name="sexo" value="outro" />
                                    <svg class="input-icon">
                                        <use href="../assets/icons/sprite.svg#icon-users"></use>
                                    </svg>
                                    <span>Outro</span>
                                </label>
                            </div>
                        </div>

                        <header>
                            <div class="line"></div>
                            <h3>Dados Pedagógicos</h3>
                            <div class="line"></div>
                        </header>
                        <common-field label="Nível Inicial da Escrita"
                            placeholder="Selecione o nível de escrita inicial" input_id="input-form-writing-level"
                            is_select="true" size="field">
                            <option value="pre-silabico">Pré-Silábico</option>
                            <option value="silabico">Silábico</option>
                            <option value="silabico-alfabetico">Silábico-Alfabético</option>
                            <option value="alfabetico">Alfabético</option>
                        </common-field>

                        <common-field label="Observações (opcional)"
                            placeholder="Adicione observações pedagógicas sobre o aluno..." input_id="input-form-notes"
                            size="field">
                        </common-field>
                    </form>


                    <div class="botoes">
                        <button type="button"
                            onclick="document.getElementById('activity-modal').close()">Cancelar</button>
                        <button class="botao-largo" type="submit">
                            <svg>
                                <use href="../assets/icons/sprite.svg#icon-save"></use>
                            </svg>
                            <p>Salvar Atividade</p>
                        </button>
                    </div>
                </div>
            </div>
        </dialog>

    </base-body>
</body>

</html>
