<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/students.css">

    <script type="module" src="../js/components/base/load.js"></script>
    <script type="module" src="../js/components/students/load.js"></script>

    <script type="module" src="../js/request/student.js" defer></script>
</head>

<body>
    <base-body active="students">
        <header>
            <h1>Bom Dia, Professor <span class="nome-professor"></span>👋</h1>
            <div class="bottom">
                <div class="class">
                    <h3>Atividades - Turma:</h3>
                    <h2 class="turma-titulo">3º A</h2>
                </div>
                <button class="botao-largo" onclick="document.getElementById('student-modal').showModal()">
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-plus"></use>
                    </svg>
                    <p>Novo Aluno</p>
                </button>
            </div>
        </header>
        <input class="search" placeholder="Pesquisar por Turma..."></input>
        <div class="cards" id="div-student-cards">
        </div>
        <dialog id="student-modal" class="modal">
            <div class="add">
                <header>
                    <h3>Novo Aluno</h3>
                    <svg onclick="document.getElementById('activity-modal').close()">
                        <use href="../assets/icons/sprite.svg#icon-x"></use>
                    </svg>
                </header>
            </div>
        </dialog>

    </base-body>
</body>

</html>
