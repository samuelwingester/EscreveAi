<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/classes.css">

    <script type="module" src="../js/components/base/load.js"></script>
    <script type="module" src="../js/components/classes/load.js"></script>
    <script type="module" src="../js/components/common/load.js"></script>

    <script type="module" src="../js/request/base.js"></script>
</head>

<body>
    <base-body active="classes">
        <header>
            <h1>Bom Dia, Professor <span id="nome-professor">João</span>👋</h1>
            <div class="bottom">
                <div class="class">
                    <h3>Turmas -</h3>
                    <p class="title">Gerencie todas as suas turmas cadastradas.</p>
                </div>
                <button class="botao-largo" onclick="document.getElementById('class-modal').showModal()">
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-plus"></use>
                    </svg>
                    <p>Nova Turma</p>
                </button>
            </div>
        </header>

        <input class="search" placeholder="Pesquisar por Turma...">

        <div class="classes">
            <class-card name="1º A" students="22" shift="Manhã" color="purple"></class-card>
            <class-card name="2º A" students="25" shift="Manhã" color="green"></class-card>
            <class-card name="3º A" students="24" shift="Manhã" color="purple"></class-card>
            <class-card name="4º A" students="20" shift="Manhã" color="red"></class-card>
            <class-card name="5º A" students="28" shift="Manhã" color="blue"></class-card>

            <class-card name="1º B" students="19" shift="Tarde" color="yellow"></class-card>
            <class-card name="2º B" students="18" shift="Tarde" color="blue"></class-card>
            <class-card name="3º B" students="26" shift="Tarde" color="red"></class-card>
            <class-card name="4º B" students="21" shift="Tarde" color="green"></class-card>
            <class-card name="5º B" students="23" shift="Tarde" color="yellow"></class-card>
        </div>

        <dialog id="class-modal" class="modal">
            <div class="add">
                <header>
                    <h2>Nova Turma</h2>
                    <svg onclick="document.getElementById('class-modal').close()">
                        <use href="../assets/icons/sprite.svg#icon-x"></use>
                    </svg>
                </header>
                <div class="forms">
                    <div class="info">
                        <div class="line"></div>
                        <h3 class="purple">INFORMAÇÕES DA TURMA</h3>
                        <div class="line"></div>
                    </div>
                    <form action="#">
                        <common-field label="Nome da Turma" placeholder="3º A" input_id="input-form-name" size="field">
                        </common-field>

                        <common-field label="Escola" placeholder="Escola Municipal João XXIII"
                            input_id="input-form-school" size="field">
                        </common-field>

                        <common-field label="Série" placeholder="Escreva a Série" input_id="input-form-grade"
                            size="minifield">
                        </common-field>

                        <common-field label="Turno" input_id="input-form-shift" placeholder="Selecione..."
                            is_select="true" size="minifield">
                            <option value="manha">Manhã</option>
                            <option value="tarde">Tarde</option>
                            <option value="noite">Noite</option>
                        </common-field>

                        <div class="line"></div>

                        <div class="botoes">
                            <button class="botao-largo" type="button"
                                onclick="document.getElementById('class-modal').close()">
                                <p>Cancelar</p>
                            </button>
                            <button class="botao-largo" type="submit">
                                <svg>
                                    <use href="../assets/icons/sprite.svg#icon-save"></use>
                                </svg>
                                <p>Salvar Turma</p>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </dialog>
    </base-body>
</body>

</html>
