<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreve Aí</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/classes.css">
    <script type="module" src="../js/components/main.js"></script>
</head>

<body>
    <my-base active="classes">
        <header>
            <h1>Bom Dia, Professor <span id="nome-professor">João</span>👋</h1>
            <div class="bottom">
                <div class="class">
                    <h3>Turmas -</h3>
                    <p class="title">Gerencie todas as suas turmas cadastradas.</p>
                </div>
                <button class="botao-largo" onclick="document.getElementById('class-modal').showModal()">
                    <svg>
                        <use href="../assets/icons/sprite.svg#icon-plus"></use>
                    </svg>
                    <p>Nova Turma</p>
                </button>
            </div>
        </header>
        <input class="search" placeholder="Pesquisar por Aluno..."></input>
        <div class="classes">
            <div class="class">
                <div class="top">
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="5" cy="5" r="5" fill="purple" />
                    </svg>
                    <p class="titl">3º Ano A</p>
                </div>
                <div class="data">
                    <div class="students">
                        <svg>
                            <use href="../assets/icons/sprite.svg#icon-students"></use>
                        </svg><p>24 Alunos</p>
                    </div>
                    <div class="shift">
                        <svg>
                            <use href="../assets/icons/sprite.svg#icon-calendar"></use>
                        </svg><p>Manhã</p>
                    </div>
                </div>
                <div class="join">
                    <p>Entrar</p>
                </div>
            </div>
        </div>
    </my-base>
</body>

</html>
